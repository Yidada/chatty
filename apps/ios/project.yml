# XcodeGen 工程定义。Xcode 工程由此文件生成，不提交 Chatty.xcodeproj。
# 生成：brew install xcodegen && xcodegen generate
name: Chatty
options:
  bundleIdPrefix: ai.chatty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9247PC9936
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chatty:
    type: application
    platform: iOS
    sources:
      - path: Chatty
    info:
      path: Chatty/Info.plist
      properties:
        CFBundleDisplayName: Chatty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chatty.ios
        PRODUCT_NAME: Chatty
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ChattyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChattyTests
    dependencies:
      - target: Chatty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.chatty.ios.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  Chatty:
    build:
      targets:
        Chatty: all
        ChattyTests: [test]
    test:
      targets:
        - ChattyTests
